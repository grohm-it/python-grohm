[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grohm"
version = "0.1.1"
description = "Async Python client for Grohm EV chargers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Emme Esse S.p.A." }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9"]
keywords = ["grohm", "ev", "charger", "wallbox", "home-assistant"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/grohm-it/python-grohm"
Issues = "https://github.com/grohm-it/python-grohm/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov", "mypy", "ruff"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "LICENSE", "NOTICE", "README.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "D", "SIM"]
ignore = ["E501", "D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.mypy]
strict = true
